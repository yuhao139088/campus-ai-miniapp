services:
  server:
    build: ./server
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      PORT: 8787
      DATA_DIR: /app/data
    volumes:
      - campus-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  campus-data:
